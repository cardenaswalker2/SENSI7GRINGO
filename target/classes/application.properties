server.port=8080
server.servlet.context-path=/

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Static assets
spring.web.resources.static-locations=classpath:/static/

# MongoDB flexible configuration
# Can be overridden via env vars: SPRING_DATA_MONGODB_URI
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/sensi7gringo}
spring.data.mongodb.auto-index-creation=true

# Application Custom Properties
sensi7gringo.version=1.0.0
sensi7gringo.brand=Sensi7gringo
sensi7gringo.slogan=Domina el Campo con Sensibilidad Milimetrica
sensi7gringo.mongodb.fallback-enabled=true

# Logging
logging.level.com.sensi7gringo=INFO
logging.level.org.springframework.data.mongodb=WARN
